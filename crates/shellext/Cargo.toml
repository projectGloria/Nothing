[package]
name = "nothing-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

# Explorer loads this in-process: the IExplorerCommand handler behind the "Nothing" entry in
# Windows 11's compact right-click menu (declared by the sparse package in /package).
[lib]
name = "nothing_shell"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
]

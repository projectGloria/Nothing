[package]
name = "nothing-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nothing-setup"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

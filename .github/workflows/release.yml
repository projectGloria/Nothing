name: Build installer

# Push a tag like v1.0.0 to build the app, pack it with GloriaSetup and attach
# Nothing_<version>_x64-setup.exe to that tag's release, or run it by hand
# (Actions > Build installer > Run workflow) with the tag to publish under.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build app
        run: cargo build --release --target x86_64-pc-windows-msvc -p nothing -p nothing-svc -p nothing-shell

      - name: Collect runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force app-dist | Out-Null
          foreach ($f in 'Nothing.exe', 'nothing-svc.exe', 'nothing_shell.dll') {
            Copy-Item "target/x86_64-pc-windows-msvc/release/$f" app-dist/
          }

      - name: Make sure the release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Nothing $TAG" --generate-notes --target "$GITHUB_SHA"
          fi

      - name: Pack and attach the setup
        uses: projectGloria/GloriaSetup@v0.1.0
        with:
          app-dir: app-dist
          manifest: gloria.toml
          version: ${{ startsWith(env.TAG, 'v') && substring(env.TAG, 1, 100) || env.TAG }}
          release-tag: ${{ env.TAG }}
          certificate: ${{ secrets.WINDOWS_PFX_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}
